<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fútbol Pong</title>

<style>
body{
    margin:0;
    background:#0d5f1c;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:Arial,sans-serif;
    color:white;
}

h1{
    margin:10px;
}

#menu{
    margin-bottom:10px;
}

canvas{
    border:4px solid white;
    background:#1c8a32;
}

button{
    padding:8px 15px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>⚽ Fútbol Pong ⚽</h1>

<div id="menu">
    <button id="modeBtn">Modo: IA</button>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let iaMode = true;

document.getElementById("modeBtn").onclick = () => {
    iaMode = !iaMode;
    document.getElementById("modeBtn").innerText =
        iaMode ? "Modo: IA" : "Modo: 2 Jugadores";
};

const paddleWidth = 15;
const paddleHeight = 100;
const ballSize = 15;

const leftPlayer = {
    x:20,
    y:200,
    speed:7,
    score:0
};

const rightPlayer = {
    x:canvas.width - 35,
    y:200,
    speed:7,
    score:0
};

const ball = {
    x:canvas.width/2,
    y:canvas.height/2,
    vx:5,
    vy:3
};

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key] = false;
});

function resetBall(){
    ball.x = canvas.width/2;
    ball.y = canvas.height/2;

    ball.vx = (Math.random()>0.5 ? 5 : -5);
    ball.vy = (Math.random()*6)-3;
}

function drawField(){

    ctx.fillStyle="#1c8a32";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle="white";
    ctx.lineWidth=3;

    ctx.strokeRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();
    ctx.moveTo(canvas.width/2,0);
    ctx.lineTo(canvas.width/2,canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(canvas.width/2,canvas.height/2,70,0,Math.PI*2);
    ctx.stroke();
}

function drawPlayers(){

    ctx.fillStyle="blue";
    ctx.fillRect(
        leftPlayer.x,
        leftPlayer.y,
        paddleWidth,
        paddleHeight
    );

    ctx.fillStyle="red";
    ctx.fillRect(
        rightPlayer.x,
        rightPlayer.y,
        paddleWidth,
        paddleHeight
    );
}

function drawBall(){
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ballSize, 0, Math.PI*2);
    ctx.fill();
}

function drawScore(){
    ctx.font="40px Arial";
    ctx.fillStyle="white";

    ctx.fillText(
        leftPlayer.score,
        canvas.width/2 - 80,
        50
    );

    ctx.fillText(
        rightPlayer.score,
        canvas.width/2 + 50,
        50
    );
}

function updatePlayers(){

    // Jugador izquierdo
    if(keys["w"] || keys["W"])
        leftPlayer.y -= leftPlayer.speed;

    if(keys["s"] || keys["S"])
        leftPlayer.y += leftPlayer.speed;

    leftPlayer.y = Math.max(
        0,
        Math.min(canvas.height-paddleHeight,leftPlayer.y)
    );

    if(iaMode){

        let center =
            rightPlayer.y + paddleHeight/2;

        if(ball.y < center - 10)
            rightPlayer.y -= 5;

        if(ball.y > center + 10)
            rightPlayer.y += 5;

    }else{

        if(keys["ArrowUp"])
            rightPlayer.y -= rightPlayer.speed;

        if(keys["ArrowDown"])
            rightPlayer.y += rightPlayer.speed;
    }

    rightPlayer.y = Math.max(
        0,
        Math.min(canvas.height-paddleHeight,rightPlayer.y)
    );
}

function updateBall(){

    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.y-ballSize < 0 ||
       ball.y+ballSize > canvas.height){
        ball.vy *= -1;
    }

    // Colisión izquierda
    if(
        ball.x-ballSize < leftPlayer.x+paddleWidth &&
        ball.y > leftPlayer.y &&
        ball.y < leftPlayer.y+paddleHeight
    ){
        ball.vx *= -1.1;
    }

    // Colisión derecha
    if(
        ball.x+ballSize > rightPlayer.x &&
        ball.y > rightPlayer.y &&
        ball.y < rightPlayer.y+paddleHeight
    ){
        ball.vx *= -1.1;
    }

    // Gol derecha
    if(ball.x < 0){
        rightPlayer.score++;
        resetBall();
    }

    // Gol izquierda
    if(ball.x > canvas.width){
        leftPlayer.score++;
        resetBall();
    }
}

function gameLoop(){

    drawField();

    updatePlayers();
    updateBall();

    drawPlayers();
    drawBall();
    drawScore();

    requestAnimationFrame(gameLoop);
}

resetBall();
gameLoop();
</script>

</body>
</html>
